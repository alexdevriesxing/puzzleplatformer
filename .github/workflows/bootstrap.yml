name: Materialize first-pass game

on:
  push:
    branches: [agent/first-pass-game]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-pass-game
          fetch-depth: 0
      - name: Reconstruct project
        run: |
          cat .bootstrap/part-* | tr -d '\n' | base64 -d > /tmp/puzzleplatformer.tar.gz
          mkdir -p /tmp/puzzleplatformer
          tar -xzf /tmp/puzzleplatformer.tar.gz -C /tmp/puzzleplatformer
          rsync -a --delete --exclude='.git' /tmp/puzzleplatformer/ ./
      - name: Validate campaign
        run: npm run check
      - name: Commit materialized game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Pip and the Prism Vault"
          git push origin HEAD:agent/first-pass-game
