name: Build Cloudflare-ready web game

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-materialize.yml'
      - '.release/**'
      - '.cloudflare-release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-all
          fetch-depth: 0

      - name: Create Cloudflare web deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release .release2 .cloudflare-release
          mkdir -p scripts

          cat > package.json <<'JSON'
          {
            "name": "pip-and-the-prism-vault",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "serve": "python3 -m http.server 4173",
              "build": "node scripts/build.mjs",
              "dev": "npm run build && wrangler dev",
              "test": "node tests/validate-levels.mjs",
              "check": "node --check src/levels.js && node --check src/art.js && node --check src/audio.js && node --check src/game.js && node --check src/bootstrap.js && npm run test && npm run build",
              "deploy": "npm run check && wrangler deploy"
            },
            "devDependencies": {
              "wrangler": "4.112.0"
            },
            "engines": {
              "node": ">=22"
            }
          }
          JSON

          cat > wrangler.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "pip-prism-vault",
            "compatibility_date": "2026-07-20",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

          cat > scripts/build.mjs <<'JS'
          import { cp, mkdir, readFile, rm, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const out = new URL('../dist/', import.meta.url);
          await rm(out, { recursive: true, force: true });
          await mkdir(out, { recursive: true });
          for (const file of ['index.html', 'styles.css', 'manifest.webmanifest', 'service-worker.js', '.nojekyll']) {
            await cp(new URL(`../${file}`, import.meta.url), new URL(file, out));
          }
          for (const dir of ['src', 'assets']) {
            await cp(new URL(`../${dir}/`, import.meta.url), new URL(`${dir}/`, out), { recursive: true });
          }
          const source = await readFile(new URL('../src/game.js', import.meta.url));
          const revision = createHash('sha256').update(source).digest('hex').slice(0, 12);
          const swPath = new URL('service-worker.js', out);
          const sw = (await readFile(swPath, 'utf8')).replaceAll('__BUILD_REVISION__', revision);
          await writeFile(swPath, sw);
          console.log(`Built Cloudflare static bundle: dist/ (${revision})`);
          JS

          cat > src/bootstrap.js <<'JS'
          import './game.js';
          if ('serviceWorker' in navigator && location.protocol === 'https:') {
            addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(error => console.warn('Offline mode unavailable:', error)));
          }
          JS

          cat > service-worker.js <<'JS'
          const CACHE = 'pip-prism-vault-__BUILD_REVISION__';
          const CORE = [
            './', './index.html', './styles.css', './manifest.webmanifest',
            './src/bootstrap.js', './src/game.js', './src/levels.js', './src/art.js', './src/audio.js',
            './assets/icon.svg', './assets/logo.svg', './assets/key-art.svg', './assets/hero-model-sheet.svg'
          ];
          self.addEventListener('install', event => event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(CORE)).then(() => self.skipWaiting())));
          self.addEventListener('activate', event => event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key)))).then(() => self.clients.claim())));
          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(caches.match(event.request).then(hit => hit || fetch(event.request).then(response => {
              if (response.ok && new URL(event.request.url).origin === location.origin) {
                const copy = response.clone();
                caches.open(CACHE).then(cache => cache.put(event.request, copy));
              }
              return response;
            }).catch(() => caches.match('./index.html'))));
          });
          JS

          cat > manifest.webmanifest <<'JSON'
          {
            "name": "Pip & the Prism Vault",
            "short_name": "Prism Vault",
            "description": "A 100-room single-screen puzzle arcade adventure.",
            "start_url": "./",
            "scope": "./",
            "display": "fullscreen",
            "orientation": "landscape",
            "background_color": "#080b18",
            "theme_color": "#171b38",
            "icons": [{ "src": "assets/icon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any maskable" }]
          }
          JSON

          cat > .assetsignore <<'TXT'
          .git/
          .github/
          docs/
          tests/
          scripts/
          node_modules/
          package*.json
          wrangler.jsonc
          README.md
          LICENSE
          TXT

          cat > .gitignore <<'TXT'
          node_modules/
          dist/
          .wrangler/
          .dev.vars
          .DS_Store
          TXT

          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          if 'manifest.webmanifest' not in html:
              html = html.replace('<title>', '<meta name="theme-color" content="#171b38"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><title>')
          html = html.replace('src="src/game.js"', 'src="src/bootstrap.js"')
          path.write_text(html)
          PY

          if ! grep -q '## Deploy to Cloudflare' README.md; then
            cat >> README.md <<'MD'

          ## Deploy to Cloudflare

          This repository deploys as a Cloudflare Worker with Static Assets. The production bundle is generated in `dist/`; source files remain outside the deployed asset directory.

          ```bash
          npm install
          npm run check
          npx wrangler login
          npm run deploy
          ```

          Wrangler creates the `pip-prism-vault` Worker and prints the preview or production URL. For automated GitHub deployment, configure `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` repository secrets before merging to `main`.

          Local Cloudflare runtime:

          ```bash
          npm install
          npm run dev
          ```

          The game is installable as a landscape PWA and caches its core shell for offline play after the first successful load.
          MD
          fi

          npm install --ignore-scripts
          npm run check
          npx wrangler deploy --dry-run

      - name: Commit Cloudflare source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'Build Cloudflare-ready web game'
          git push origin HEAD:agent/polish-all
