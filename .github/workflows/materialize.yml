name: Materialize polished game

on:
  push:
    branches: [agent/polish-all]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-all
          fetch-depth: 0
      - name: Reconstruct polished source
        run: |
          cat .bootstrap/part-* | tr -d '\n' | base64 -d > /tmp/pip-source.tar.gz
          tar -xzf /tmp/pip-source.tar.gz -C .
      - name: Validate all 100 rooms
        run: npm run check
      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Pip and the Prism Vault"
          git push origin HEAD:agent/polish-all
