<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10152f" />
  <meta name="description" content="Super Sean 007 & the Prism Vault — a 100-room puzzle adventure from www.supersean007.com featuring strategic 8-bit mechanics, modern graphics, and offline play." />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Super Sean 007 & the Prism Vault" />
  <meta property="og:title" content="Super Sean 007 & the Prism Vault" />
  <meta property="og:description" content="Official Super Sean 007 100-room puzzle adventure from www.supersean007.com." />
  <meta property="og:image" content="assets/commercial/og-image.webp" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Super Sean 007 &amp; the Prism Vault" />
  <meta name="twitter:description" content="Official Super Sean 007 100-room puzzle adventure from www.supersean007.com." />
  <meta name="twitter:image" content="assets/commercial/og-image.webp" />
  <meta name="app-version" content="__APP_VERSION__" />
  <meta name="build-revision" content="__BUILD_REVISION__" />
  <title>Super Sean 007 &amp; the Prism Vault</title>
  <link rel="icon" href="assets/commercial/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/commercial/app-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body data-boot="loading">
  <section id="boot-overlay" role="status" aria-live="polite" aria-label="Loading Pip and the Prism Vault">
    <img src="assets/commercial/logo.png" alt="Pip and the Prism Vault" width="560" height="202" />
    <div class="boot-copy">
      <strong>Opening the Prism Vault</strong>
      <progress id="boot-progress" max="100" value="0">0%</progress>
      <span id="boot-message">Preparing production artwork…</span>
      <button id="boot-retry" type="button" hidden>Reload game</button>
    </div>
  </section>
  <main id="app" aria-label="Pip and the Prism Vault game">
    <canvas
      id="game"
      width="1280"
      height="720"
      tabindex="0"
      role="application"
      aria-label="Pip and the Prism Vault. Use arrow keys or WASD to move, Tab to navigate menus, Z to undo, R to retry, and Escape to pause."
      aria-describedby="status"
      aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight W A S D Enter Space Z R H M F Escape Tab"
    ></canvas>
    <p id="status" class="sr-only" aria-live="polite">Pip and the Prism Vault loaded.</p>
    <section id="touch-controls" aria-label="Touch controls">
      <div class="dpad">
        <button data-key="ArrowUp" aria-label="Move up">▲</button>
        <button data-key="ArrowLeft" aria-label="Move left">◀</button>
        <button data-key="ArrowDown" aria-label="Move down">▼</button>
        <button data-key="ArrowRight" aria-label="Move right">▶</button>
      </div>
      <div class="actions">
        <button data-key="z" aria-label="Undo">UNDO</button>
        <button data-key="r" aria-label="Restart">RETRY</button>
        <button data-key="h" aria-label="Show hint">HINT</button>
        <button data-key="Escape" aria-label="Pause">PAUSE</button>
      </div>
    </section>
  </main>
  <aside id="system-banner" role="status" aria-live="polite" hidden>
    <span id="system-message"></span>
    <div>
      <button id="system-action" type="button" hidden>Reload now</button>
      <button id="system-dismiss" type="button" aria-label="Dismiss message">Dismiss</button>
    </div>
  </aside>
  <noscript>This game requires JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
