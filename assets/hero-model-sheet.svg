<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">Pip hero model sheet</title><desc id="desc">Front, side, run, push, hurt, and victory poses for Pip.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#18254c"/><stop offset="1" stop-color="#0b1024"/></linearGradient><linearGradient id="coat" x2="0" y2="1"><stop stop-color="#76f6ff"/><stop offset="1" stop-color="#2a91cb"/></linearGradient><g id="pip"><path d="M-45 25c-55 12-90 36-119 72l102-18z" fill="#ff5d7e"/><ellipse cy="51" rx="48" ry="62" fill="url(#coat)" stroke="#080e25" stroke-width="8"/><ellipse cx="-27" cy="108" rx="35" ry="18" fill="#313b61" stroke="#080e25" stroke-width="8"/><ellipse cx="33" cy="108" rx="35" ry="18" fill="#313b61" stroke="#080e25" stroke-width="8"/><circle cy="-31" r="52" fill="#fff0cf" stroke="#080e25" stroke-width="8"/><path d="M-53-40a53 53 0 0 1 106 0C17-56-17-56-53-40z" fill="#3b4980" stroke="#080e25" stroke-width="8"/><circle cx="31" cy="-84" r="13" fill="#ffe56d"/><ellipse cx="-19" cy="-28" rx="5" ry="8" fill="#10162d"/><ellipse cx="20" cy="-28" rx="5" ry="8" fill="#10162d"/><path d="M-13-2q15 13 29 0" fill="none" stroke="#c56768" stroke-width="6" stroke-linecap="round"/></g></defs>
<rect width="1400" height="780" rx="34" fill="url(#bg)"/><g stroke="#ffffff10"><path d="M0 260h1400M0 520h1400"/><path d="M233 0v780M466 0v780M699 0v780M932 0v780M1165 0v780"/></g>
<text x="56" y="64" fill="#fff4d6" font-family="Trebuchet MS,sans-serif" font-size="38" font-weight="1000">PIP · SPARKKEEPER MODEL &amp; MOTION SHEET</text><text x="56" y="104" fill="#78efff" font-family="Trebuchet MS,sans-serif" font-size="19" font-weight="800">Cyan coat · coral scarf · moon-cap · warm face · readable at 32–96 px</text>
<g font-family="Trebuchet MS,sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#dbe7ff">
<g transform="translate(140 300)"><use href="#pip"/><text y="175">NEUTRAL</text></g>
<g transform="translate(370 300)"><g transform="skewY(-2)"><use href="#pip"/></g><path d="M-42 43l-39 35M44 43l39 35" stroke="#fff0cf" stroke-width="15" stroke-linecap="round"/><text y="175">WALK</text></g>
<g transform="translate(600 300) rotate(-8)"><use href="#pip"/><path d="M-45 48l-70-33M45 48l75-24" stroke="#fff0cf" stroke-width="15" stroke-linecap="round"/><text y="184" transform="rotate(8)">RUN</text></g>
<g transform="translate(830 300)"><use href="#pip"/><path d="M-43 35h-75M44 35h75" stroke="#fff0cf" stroke-width="15" stroke-linecap="round"/><rect x="116" y="-15" width="72" height="72" rx="10" fill="#b46e49" stroke="#ffe08a" stroke-width="7"/><text y="175">PUSH</text></g>
<g transform="translate(1060 300) rotate(12)"><use href="#pip"/><path d="M-48 40l-64-54M47 40l67-52" stroke="#fff0cf" stroke-width="15" stroke-linecap="round"/><text y="184" transform="rotate(-12)">HURT</text></g>
<g transform="translate(1290 300)"><use href="#pip"/><path d="M-43 44l-48-82M44 44l49-82" stroke="#fff0cf" stroke-width="15" stroke-linecap="round"/><g fill="#ffe56d"><path d="M-87-85l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/><path d="M92-91l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/></g><text y="175">VICTORY</text></g></g>
<g transform="translate(60 560)" font-family="Trebuchet MS,sans-serif"><rect width="1280" height="155" rx="24" fill="#111a34" stroke="#ffffff24" stroke-width="3"/><text x="32" y="42" fill="#ffe56d" font-size="20" font-weight="1000">ANIMATION PRINCIPLES</text><text x="32" y="78" fill="#fff4d6" font-size="19" font-weight="800">• 6-frame walk with scarf drag and cap bob   • 8-frame run with clear contact pose   • 4-frame push anticipation</text><text x="32" y="111" fill="#fff4d6" font-size="19" font-weight="800">• 5-frame hurt recoil with silhouette break   • 10-frame victory loop   • squash never exceeds 8%</text><text x="32" y="140" fill="#88e9ff" font-size="16" font-weight="800">Pip’s face, cap light, scarf angle, and coat proportions remain canonical across the series.</text></g></svg>
